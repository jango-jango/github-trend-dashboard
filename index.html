<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Weekly Trend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg0: #0f1419;
        --bg1: #172029;
        --ink: #e8eef4;
        --muted: #8fa0b0;
        --line: #2a3642;
        --accent: #3ecf8e;
        --warn: #f0a35e;
        --danger: #ef6b6b;
        --rank: #5b6b7a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, #1a2e28 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #1c2433 0%, transparent 50%),
          var(--bg0);
      }

      main {
        width: min(880px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2.5rem 0 4rem;
      }

      .brand {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 0.75rem;
      }

      h1 {
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
        line-height: 1.2;
      }

      .lede {
        color: var(--muted);
        margin: 0 0 1.75rem;
        max-width: 36rem;
        line-height: 1.55;
      }

      .diag {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      .diag-item {
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg1) 88%, transparent);
        padding: 0.9rem 1rem;
      }

      .diag-item .label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }

      .diag-item .value {
        font-family: "IBM Plex Mono", monospace;
        font-size: 1rem;
        font-weight: 500;
      }

      .diag-item.ok .value {
        color: var(--accent);
      }
      .diag-item.warn .value {
        color: var(--warn);
      }
      .diag-item.bad .value {
        color: var(--danger);
      }

      .comment {
        border-left: 3px solid var(--accent);
        padding: 0.25rem 0 0.25rem 1rem;
        margin: 0 0 2rem;
        color: var(--ink);
        line-height: 1.65;
        white-space: pre-wrap;
      }

      .comment.empty {
        color: var(--muted);
        border-left-color: var(--line);
      }

      .section-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.75rem;
      }

      ol.repos {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }

      .repo {
        display: grid;
        grid-template-columns: 2.5rem 1fr auto;
        gap: 0.75rem 1rem;
        align-items: start;
        padding: 1rem 0;
        border-bottom: 1px solid var(--line);
      }

      .rank {
        font-family: "IBM Plex Mono", monospace;
        color: var(--rank);
        font-size: 1rem;
        padding-top: 0.15rem;
      }

      .repo a {
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
      }

      .repo a:hover {
        color: var(--accent);
      }

      .desc {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .meta {
        margin-top: 0.45rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.75rem;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .delta {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        color: var(--accent);
        white-space: nowrap;
        padding-top: 0.15rem;
      }

      .error,
      .loading {
        color: var(--muted);
        padding: 1.5rem 0;
      }

      .error {
        color: var(--danger);
      }

      footer {
        margin-top: 2.5rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        color: var(--muted);
      }

      footer a {
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .diag {
          grid-template-columns: 1fr;
        }
        .repo {
          grid-template-columns: 2rem 1fr;
        }
        .delta {
          grid-column: 2;
          padding-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">GitHub Weekly Trend</p>
      <h1>週間スター急上昇 Top 10</h1>
      <p class="lede">
        前週の GitHub Trending（weekly）上位と、短い傾向コメント。毎週自動更新。
      </p>

      <div class="diag" id="diag" aria-live="polite">
        <div class="diag-item" id="diag-updated">
          <div class="label">最終更新</div>
          <div class="value">—</div>
        </div>
        <div class="diag-item" id="diag-count">
          <div class="label">取得件数</div>
          <div class="value">—</div>
        </div>
        <div class="diag-item" id="diag-status">
          <div class="label">自己診断</div>
          <div class="value">—</div>
        </div>
      </div>

      <p class="section-label">傾向コメント</p>
      <div class="comment empty" id="comment">読み込み中…</div>

      <p class="section-label">Repositories</p>
      <div id="list"><p class="loading">data/weekly.json を読み込み中…</p></div>

      <footer>
        Source:
        <a id="source" href="https://github.com/trending?since=weekly"
          >github.com/trending?since=weekly</a
        >
      </footer>
    </main>
    <script>
      const STALE_MS = 8 * 24 * 60 * 60 * 1000; // 8 days

      function setDiag(el, text, level) {
        el.querySelector(".value").textContent = text;
        el.classList.remove("ok", "warn", "bad");
        if (level) el.classList.add(level);
      }

      function formatJst(iso) {
        if (!iso) return "未更新";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        return new Intl.DateTimeFormat("ja-JP", {
          timeZone: "Asia/Tokyo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(d);
      }

      function diagnose(data) {
        const updatedEl = document.getElementById("diag-updated");
        const countEl = document.getElementById("diag-count");
        const statusEl = document.getElementById("diag-status");
        const count = Number(data.count ?? data.repos?.length ?? 0);
        const updatedAt = data.updatedAt;
        const age = updatedAt ? Date.now() - new Date(updatedAt).getTime() : Infinity;

        setDiag(updatedEl, formatJst(updatedAt), !updatedAt || age > STALE_MS ? "bad" : "ok");
        setDiag(countEl, String(count), count === 0 ? "bad" : count < 10 ? "warn" : "ok");

        if (count === 0) {
          setDiag(statusEl, "取得0件 — スクレイプ要確認", "bad");
        } else if (!updatedAt || age > STALE_MS) {
          setDiag(statusEl, "更新が古い — 自動実行を確認", "bad");
        } else if (count < 10) {
          setDiag(statusEl, "件数不足 — パース要確認", "warn");
        } else {
          setDiag(statusEl, "正常", "ok");
        }
      }

      function render(data) {
        diagnose(data);

        const commentEl = document.getElementById("comment");
        const comment = (data.trendComment || "").trim();
        if (comment) {
          commentEl.textContent = comment;
          commentEl.classList.remove("empty");
        } else {
          commentEl.textContent = "（傾向コメント未生成 — Routine 実行後に入ります）";
          commentEl.classList.add("empty");
        }

        if (data.sourceUrl) {
          const a = document.getElementById("source");
          a.href = data.sourceUrl;
          a.textContent = data.sourceUrl.replace(/^https?:\/\//, "");
        }

        const list = document.getElementById("list");
        const repos = data.repos || [];
        if (repos.length === 0) {
          list.innerHTML = '<p class="error">リポジトリが0件です。取得スクリプトまたはスクレイプ先を確認してください。</p>';
          return;
        }

        const ol = document.createElement("ol");
        ol.className = "repos";
        for (const r of repos) {
          const li = document.createElement("li");
          li.className = "repo";
          const delta =
            r.starsThisPeriod != null
              ? `+${r.starsThisPeriod.toLocaleString("en-US")}`
              : "—";
          const meta = [
            r.language || "Unknown",
            r.stars != null ? `★ ${r.stars.toLocaleString("en-US")}` : null,
            r.forks != null ? `フォーク ${r.forks.toLocaleString("en-US")}` : null,
          ]
            .filter(Boolean)
            .join(" · ");

          li.innerHTML = `
            <div class="rank">${String(r.rank).padStart(2, "0")}</div>
            <div>
              <a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.name}</a>
              <p class="desc">${r.description || ""}</p>
              <div class="meta">${meta}</div>
            </div>
            <div class="delta" title="stars this week">${delta}</div>
          `;
          ol.appendChild(li);
        }
        list.replaceChildren(ol);
      }

      fetch("./data/weekly.json", { cache: "no-store" })
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then(render)
        .catch((err) => {
          document.getElementById("list").innerHTML =
            `<p class="error">読み込み失敗: ${err.message}</p>`;
          setDiag(document.getElementById("diag-status"), "データ読込失敗", "bad");
        });
    </script>
  </body>
</html>
